spring.application.name=mediplan-api
server.port=8080

# Base MySQL (Laragon)
spring.datasource.url=jdbc:mysql://localhost:3306/mediplan_db?useSSL=false&serverTimezone=Africa/Dakar&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# JPA : les tables sont créées par Flyway, pas par Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Dakar

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Sécurité (JWT)
# ATTENTION : changer cette clé avant la mise en production (au moins 32 caractères).
mediplan.jwt.secret=change-moi-cle-de-developpement-mediplan-2026-tres-longue
mediplan.jwt.duree-heures=12

# Adresse du frontend Angular autorisée à appeler l'API (CORS)
mediplan.cors.origines=http://localhost:*,http://127.0.0.1:*


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MEDIPLAN_MAIL_USER:}
spring.mail.password=${MEDIPLAN_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mediplan.mail.expediteur=${MEDIPLAN_MAIL_USER:}
